<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jev AI - Ticket Dispatcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-8">
    
    <div class="max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-white">AI Ticket Dispatcher</h1>
                <p class="text-gray-400 mt-1">Powered by Jev AI & Cloudways Velocity</p>
            </div>
            <button id="simulateBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-lg font-semibold transition-colors shadow-lg">
                Simulate Influx
            </button>
        </div>

        <div class="grid grid-cols-4 gap-6">
            <!-- Columns -->
            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 h-[700px] overflow-y-auto" id="col-tech">
                <h2 class="font-semibold text-gray-300 mb-4 flex justify-between border-b border-gray-700 pb-2">
                    Tech Support <span class="bg-gray-700 px-2 rounded-full text-sm" id="count-tech">0</span>
                </h2>
                <div class="space-y-3" id="list-tech"></div>
            </div>

            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 h-[700px] overflow-y-auto" id="col-billing">
                <h2 class="font-semibold text-gray-300 mb-4 flex justify-between border-b border-gray-700 pb-2">
                    Billing <span class="bg-gray-700 px-2 rounded-full text-sm" id="count-billing">0</span>
                </h2>
                <div class="space-y-3" id="list-billing"></div>
            </div>

            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 h-[700px] overflow-y-auto" id="col-sales">
                <h2 class="font-semibold text-gray-300 mb-4 flex justify-between border-b border-gray-700 pb-2">
                    Sales <span class="bg-gray-700 px-2 rounded-full text-sm" id="count-sales">0</span>
                </h2>
                <div class="space-y-3" id="list-sales"></div>
            </div>

            <div class="bg-gray-800 rounded-xl p-4 border border-gray-700 h-[700px] overflow-y-auto" id="col-spam">
                <h2 class="font-semibold text-gray-300 mb-4 flex justify-between border-b border-gray-700 pb-2">
                    Spam <span class="bg-gray-700 px-2 rounded-full text-sm" id="count-spam">0</span>
                </h2>
                <div class="space-y-3" id="list-spam"></div>
            </div>
        </div>
    </div>

    <script>
        const messages = [
            "My dashboard keeps throwing a 500 error when I try to save.",
            "I was charged twice for my subscription this month.",
            "Send 10 BTC to this wallet to unlock your account immediately.",
            "Does the enterprise plan include custom SAML SSO?",
            "I forgot my password and the reset link isn't arriving.",
            "Can I get a refund for the last 3 months? I haven't used it.",
            "Earn $5000 a week working from home, click here!",
            "How much is it to add 50 more seats to our current plan?",
            "The API rate limit is blocking my webhooks suddenly.",
            "My credit card expired, how do I update my payment method?",
            "Hot crypto presale launching today, don't miss out!",
            "We need to discuss volume discounts for an agency rollout.",
            "My server keeps crashing every time I upload a PDF.",
            "Where can I download my VAT invoices?",
            "Can I upgrade my account from Pro to Business mid-cycle?"
        ];

        const simulateBtn = document.getElementById('simulateBtn');

        simulateBtn.addEventListener('click', async () => {
            simulateBtn.disabled = true;
            simulateBtn.innerText = "Processing...";
            simulateBtn.classList.replace('bg-blue-600', 'bg-gray-600');

            // Fire all 15 requests simultaneously 
            await Promise.all(messages.map(processMessage));

            simulateBtn.innerText = "Influx Complete";
        });

        async function processMessage(msg) {
            const startTime = performance.now();
            
            try {
                const response = await fetch('/api/sort-message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                
                const result = await response.json();
                const endTime = performance.now();
                const latency = Math.round(endTime - startTime);
                
                renderCard(msg, result.category, result.confidence, latency);
            } catch (error) {
                console.error("Error sorting message:", error);
            }
        }

        function renderCard(msg, category, confidence, latency) {
            let colId = 'list-tech';
            let countId = 'count-tech';
            
            if (category === 'Billing') { colId = 'list-billing'; countId = 'count-billing'; }
            if (category === 'Sales') { colId = 'list-sales'; countId = 'count-sales'; }
            if (category === 'Spam') { colId = 'list-spam'; countId = 'count-spam'; }

            const list = document.getElementById(colId);
            const countObj = document.getElementById(countId);
            
            countObj.innerText = parseInt(countObj.innerText) + 1;

            const card = document.createElement('div');
            card.className = "bg-gray-900 border border-gray-600 rounded-lg p-3 text-sm shadow-md animate-fade-in";
            
            card.innerHTML = `
                <p class="text-gray-200 mb-3 line-clamp-3">"${msg}"</p>
                <div class="flex justify-between items-center text-xs font-medium">
                    <span class="text-green-400 bg-green-400/10 px-2 py-1 rounded">Conf: ${confidence}%</span>
                    <span class="text-blue-400 bg-blue-400/10 px-2 py-1 rounded">${latency} ms</span>
                </div>
            `;
            
            // Insert at top of list
            list.insertBefore(card, list.firstChild);
        }
    </script>
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</body>
</html>
